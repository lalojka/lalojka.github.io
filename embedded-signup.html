<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KinesicPro - Conectar WhatsApp</title>
  <!-- v6 -->
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f0f2f5;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 { color: #1a1a1a; font-size: 22px; margin-bottom: 8px; }
    p { color: #666; font-size: 14px; margin-bottom: 28px; }
    #launch-btn {
      background-color: #1877f2;
      border: 0;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      height: 40px;
      padding: 0 24px;
      width: 100%;
    }
    #launch-btn:disabled { background: #aaa; cursor: not-allowed; }
    #result {
      margin-top: 24px;
      padding: 16px;
      border-radius: 8px;
      font-size: 13px;
      text-align: left;
      display: none;
    }
    #result.success { background: #e6f4ea; color: #2d6a4f; border: 1px solid #95d5b2; }
    #result.error   { background: #fdecea; color: #b91c1c; border: 1px solid #fca5a5; }
    #result pre { margin: 8px 0 0; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
    .status { font-size: 13px; color: #888; margin-top: 12px; }
  </style>
</head>
<body>

<div class="card">
  <h1>Conectar WhatsApp a KinesicPro</h1>
  <p>Hace clic en el boton para iniciar el proceso de registro.<br>
     Si tu numero ya tiene WhatsApp Business App, vas a ver la opcion de <strong>Coexistence</strong>.</p>

  <button id="launch-btn" onclick="launchWhatsAppSignup()">Login with Facebook</button>

  <div style="font-size:11px;color:#bbb;margin-top:12px;">v6</div>
  <div class="status" id="status"></div>
  <div id="result"></div>
</div>

<script>
  // SDK initialization
  window.fbAsyncInit = function() {
    FB.init({
      appId: '493451440039423',
      autoLogAppEvents: true,
      xfbml: true,
      version: 'v25.0'
    });
  };

  // Session logging message event listener
  window.addEventListener('message', (event) => {
    if (!event.origin.endsWith('facebook.com')) return;
    try {
      const data = JSON.parse(event.data);
      if (data.type === 'WA_EMBEDDED_SIGNUP') {
        console.log('message event: ', data);
        if (data.event === 'FINISH' || data.event === 'FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING') {
          showResult('success', 'Proceso completado', {
            phone_number_id: data.data.phone_number_id,
            waba_id: data.data.waba_id,
            business_id: data.data.business_id,
            event: data.event,
            nota: 'Guarda estos IDs para configurar n8n'
          });
        } else if (data.event === 'CANCEL') {
          showResult('error', 'Cancelado en: ' + data.data.current_step, data);
        }
      }
    } catch {
      console.log('message event: ', event.data);
    }
  });

  // Response callback
  const fbLoginCallback = (response) => {
    document.getElementById('launch-btn').disabled = false;
    console.log('response: ', response);
    if (response.authResponse) {
      const code = response.authResponse.code;
      document.getElementById('status').innerText = 'Autorizacion recibida. Guarda este codigo:';
      showResult('success', 'Code recibido', {
        code: code,
        nota: 'Tenes 30 segundos para intercambiarlo por un token'
      });
    } else {
      document.getElementById('status').innerText = '';
      showResult('error', 'Sin autorizacion', response);
    }
  };

  // Launch method
  const launchWhatsAppSignup = () => {
    document.getElementById('launch-btn').disabled = true;
    document.getElementById('status').innerText = 'Abriendo ventana de Meta...';
    FB.login(fbLoginCallback, {
      config_id: '1009870028122669',
      response_type: 'code',
      override_default_response_type: true,
      extras: {
        setup: {},
      }
    });
  };

  function showResult(type, title, data) {
    const el = document.getElementById('result');
    el.className = 'result ' + type;
    el.style.display = 'block';
    el.innerHTML = '<strong>' + title + '</strong><pre>' + JSON.stringify(data, null, 2) + '</pre>';
  }
</script>

<!-- SDK loading -->
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>

</body>
</html>
