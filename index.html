<!DOCTYPE html>
<html>
<head>
  <title>Login Facebook</title>
</head>
<body>
  <div id="fb-root"></div>
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v22.0&appId=493451440039423"></script>

  <div id="status"></div>
  <!-- Facebook Login Button -->
  <div 
    class="fb-login-button" 
    data-width="" 
    data-size="large" 
    data-button-type="login_with" 
    data-layout="default" 
    data-auto-logout-link="true" 
    data-use-continue-as="false" 
    data-onlogin="checkLoginState();">
  </div>

  <script src="js/oauth.js"></script>
</body>
</html>
