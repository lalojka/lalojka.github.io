<!DOCTYPE html>
<html>
<head><title>Facebook Redirect</title></head>
<body>
  <h1>Procesando login...</h1>
  <div id="status"></div>
  <script src="js/oauth.js"></script>
  <script>
    const token = parseAccessTokenFromHash();
    const statusDiv = document.getElementById("status");

    if (token) {
      sessionStorage.setItem("fb_access_token", token);
      statusDiv.textContent = "Login exitoso! Token guardado en sessionStorage.";
    } else {
      statusDiv.textContent = "Error: no se recibió token de Facebook.";
    }
  </script>
</body>
</html>
