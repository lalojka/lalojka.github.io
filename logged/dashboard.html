<!DOCTYPE html>
<html lang="es">
<head>
  <script type="module">
    import { insertHead } from './js/head.js';
    insertHead({
      title: "EPM APP – Dashboard",
      description: "Accedé a tus métricas y productos digitales.",
      ogTitle: "EPM APP Dashboard",
      ogDescription: "Accedé a tus métricas y reportes de Instagram con EPM APP."
    });
  </script>
</head>
<body>
  <!-- Header y Sidebar se insertan por layout.js -->
  <div class="dashboard-main">
    <section class="dashboard-content">
      <div id="ig-account-header"></div>
      <h2 id="welcome-title">¡Bienvenido!</h2>
      <p>Seleccioná el producto que querés usar:</p>
      <div class="dashboard-cards" id="dashboard-cards"></div>
    </section>
  </div>
  <!-- Popup Facebook Expirado -->
  <div id="fb-expired-popup" style="display:none;">
    <div class="fb-popup-content">
      <h2>Sesión expirada</h2>
      <p>Tu sesión de Facebook expiró. Por favor, volvé a iniciar sesión.</p>
      <button id="fb-popup-ok">Aceptar</button>
    </div>
  </div>
  <!-- Scripts de layout y dashboard -->
  <script type="module" src="./js/layout.js"></script>
  <script type="module" src="./js/auth.js"></script>
  <script type="module" src="./js/dashboard.js"></script>
  <script src="/logged/js/propagateDevParam.js"></script>
</body>
</html>
