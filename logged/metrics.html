<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>EPM APP – Organic data</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div class="dashboard-main">
    <section class="dashboard-content">
      <h2>Your account's organic data (last 30 days)</h2>
      <div id="progress-bar-container" style="display:none">
        <div id="progress-bar">0%</div>
      </div>
      <div id="progress-text"></div>
      <div id="results">Processing authentication...</div>
      <table id="insights-table" style="display:none"></table>
    </section>
  </div>
  <!-- Header, Sidebar y Footer se insertan por JS -->
  <script type="module">
    import { insertHeaderFooter, insertSidebar, enableLogout } from './js/layout.js';
    import { main } from './js/metrics.js';
    insertHeaderFooter();
    insertSidebar("metrics");
    enableLogout();
    main();
  </script>
</body>
</html>
