<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Instagram Metrics – EPM APP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div class="dashboard-main">
    <aside class="dashboard-sidebar"></aside>
    <section class="dashboard-content">
      <h2 id="metrics-title">Instagram Metrics</h2>
      <div id="metrics-loading">Cargando métricas...</div>
      <div id="progress-bar-container" style="display:none;">
        <div id="progress-text"></div>
        <div class="progress-bar-bg">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>
      <div id="results"></div>
      <table id="insights-table" style="display:none;"></table>
      <div id="metrics-content" style="display:none;"></div>
    </section>
  </div>
  <script type="module">
    import { insertHeaderFooter, insertSidebar, enableLogout } from './js/layout.js';
    insertHeaderFooter();
    insertSidebar("metrics");
    enableLogout();
  </script>
  <script type="module" src="./js/metrics.js"></script>
</body>
</html>
