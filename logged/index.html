<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Instagram Business Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2em; }
    #results { margin-top: 2em; }
    pre { background: #f4f4f4; padding: 1em; border-radius: 5px; }
    .error { color: red; }
    table { border-collapse: collapse; margin: 1em 0; }
    th, td { border: 1px solid #ccc; padding: 0.5em 1em; text-align: center; }
    th { background: #f0f0f0; }
  </style>
</head>
<body>
  <h1>Instagram Business Dashboard</h1>
  <div id="results">Procesando autenticación...</div>
  <script>
    function getHashParams() {
      const hash = window.location.hash.substr(1);
      const params = {};
      hash.split('&').forEach(pair => {
        const [key, value] = pair.split('=');
        if (key) params[key] = decodeURIComponent(value ?? '');
      });
      return params;
    }

    async function fetchFacebookAccounts(accessToken) {
      const endpoint = `https://graph.facebook.com/v23.0/me/accounts?fields=id,name,access_token,instagram_business_account&access_token=${accessToken}`;
      const response = await fetch(endpoint);
      return response.json();
    }

    async function fetchInstagramInsights(instagramBusinessId, accessToken, since, until) {
      const metrics = [
        'views',
        'profile_views',
        'reach',
        'website_clicks',
        'likes',
        'comments',
        'shares',
        'replies',
        'accounts_engaged'
      ].join(',');
      const endpoint =
        `https://graph.facebook.com/v20.0/${instagramBusinessId}/insights?` +
        `metric=${metrics}&period=day&since=${since}&until=${until}&metric_type=total_value&access_token=${accessToken}`;
      const response = await fetch(endpoint);
      return response.json();
    }

    // Formatea la tabla estilo Google Sheets: since, until, luego los titles y valores
    function buildSheetStyleTable(insightsData, sinceDateStr, untilDateStr) {
      if (!Array.isArray(insightsData) || insightsData.length === 0) {
        return "<em>No hay datos para mostrar.</em>";
      }
      // Headers: since, until, titles de las métricas
      const headers = ['From', 'Fecha'].concat(insightsData.map(m => m.title));
      // Valores: fechas, luego cada total_value.value
      const values = [sinceDateStr, untilDateStr].concat(
        insightsData.map(m => m.total_value?.value ?? '')
      );
      let html = "<table><thead><tr>";
      headers.forEach(h => html += `<th>${h}</th>`);
      html += "</tr></thead><tbody><tr>";
      values.forEach(v => html += `<td>${v}</td>`);
      html += "</tr></tbody></table>";
      return html;
    }

    // Calcula fechas tipo tu script de Google Apps Script
    function getSinceUntilDays(daysSince = 2, daysUntil = 1) {
      const today = new Date();
      const sinceDate = new Date(today);
      sinceDate.setDate(today.getDate() - daysSince);
      const untilDate = new Date(today);
      untilDate.setDate(today.getDate() - daysUntil);
      const pad = n => n.toString().padStart(2, '0');
      const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      return {
        sinceUnix: Math.floor(sinceDate.getTime() / 1000),
        untilUnix: Math.floor(untilDate.getTime() / 1000),
        sinceStr: fmt(sinceDate),
        untilStr: fmt(untilDate)
      };
    }

    async function main() {
      const resultsDiv = document.getElementById('results');
      const params = getHashParams();
      const accessToken = params.access_token;

      if (!accessToken) {
        resultsDiv.innerHTML = `<span class="error">
          No se encontró el token de acceso en la URL.<br>
          Por favor, inicia sesión nuevamente.
        </span>
        <pre>${JSON.stringify(params, null, 2)}</pre>`;
        return;
      }

      resultsDiv.innerHTML = "Consultando páginas y cuentas de Instagram Business...";

      try {
        const data = await fetchFacebookAccounts(accessToken);

        if (data.error) {
          resultsDiv.innerHTML = `<span class="error">Error al consultar la API:</span>
          <pre>${JSON.stringify(data.error, null, 2)}</pre>`;
          return;
        }

        const account = (data.data && data.data.length > 0) ? data.data[0] : null;
        const igBusinessId = account && account.instagram_business_account && account.instagram_business_account.id;

        if (!igBusinessId) {
          resultsDiv.innerHTML = `<span class="error">No se encontró una cuenta de Instagram Business vinculada.</span>`;
          return;
        }

        // Calcula fechas como en tu Apps Script
        const { sinceUnix, untilUnix, sinceStr, untilStr } = getSinceUntilDays();

        resultsDiv.innerHTML = `Consultando insights de Instagram Business (ID: <b>${igBusinessId}</b>)...`;

        const insights = await fetchInstagramInsights(igBusinessId, accessToken, sinceUnix, untilUnix);

        if (insights.error) {
          resultsDiv.innerHTML += `<br><span class="error">Error al consultar insights:</span>
          <pre>${JSON.stringify(insights.error, null, 2)}</pre>`;
        } else {
          resultsDiv.innerHTML += `<br><b>Tabla de insights:</b><br>
            ${buildSheetStyleTable(insights.data, sinceStr, untilStr)}
            <details>
              <summary>Ver respuesta cruda</summary>
              <pre>${JSON.stringify(insights, null, 2)}</pre>
            </details>`;
        }

      } catch (err) {
        resultsDiv.innerHTML = `<span class="error">Error de red o inesperado:</span>
        <pre>${err.message}</pre>`;
      }
    }

    main();
  </script>
</body>
</html>
