<!DOCTYPE html> <html> <head> <title>Login Callback</title> </head> <body> <h1>Callback recibido!</h1> <p>URL actual:</p> <pre id="url"></pre> <p>Hash fragment:</p> <pre id="hash"></pre> <p>Query parameters:</p> <pre id="query"></pre> <script> document.getElementById('url').textContent = window.location.href; document.getElementById('hash').textContent = window.location.hash || 'Ninguno'; document.getElementById('query').textContent = window.location.search || 'Ninguno'; // Log everything to console console.log('Full URL:', window.location.href); console.log('Hash:', window.location.hash); console.log('Search:', window.location.search); // Check for errors in URL const urlParams = new URLSearchParams(window.location.search); const hashParams = new URLSearchParams(window.location.hash.substring(1)); if (urlParams.get('error') || hashParams.get('error')) { const error = urlParams.get('error') || hashParams.get('error'); const description = urlParams.get('error_description') || hashParams.get('error_description'); document.body.innerHTML += ` <div style="color: red; border: 2px solid red; padding: 20px; margin: 20px 0;"> <h3>Error detectado:</h3> <p><strong>Error:</strong> ${error}</p> <p><strong>Descripción:</strong> ${description || 'Sin descripción'}</p> </div> `; } if (hashParams.get('access_token')) { document.body.innerHTML += ` <div style="color: green; border: 2px solid green; padding: 20px; margin: 20px 0;"> <h3>¡Token recibido!</h3> <p><strong>Access Token:</strong> ${hashParams.get('access_token').substring(0, 20)}...</p> </div> `; } </script> </body> </html>
