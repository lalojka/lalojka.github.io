<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Instagram Business Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2em; }
    #results { margin-top: 2em; }
    pre { background: #f4f4f4; padding: 1em; border-radius: 5px; }
    .error { color: red; }
    table { border-collapse: collapse; margin: 1em 0; }
    th, td { border: 1px solid #ccc; padding: 0.5em 1em; text-align: center; }
    th { background: #f0f0f0; }
  </style>
</head>
<body>
  <h1>Instagram Business Dashboard</h1>
  <div id="results">Procesando autenticación...</div>
  <script>
    // MÉTRICAS a consultar
    const METRICS = [
      'views',
      'profile_views',
      'reach',
      'website_clicks',
      'likes',
      'comments',
      'shares',
      'replies',
      'accounts_engaged'
    ];

    // Devuelve {sinceUnix, untilUnix, sinceStr, untilStr} para el día i (0 = hoy, -1 = ayer, etc)
    function getSinceUntilForDay(today, i) {
      const sinceDate = new Date(today);
      sinceDate.setDate(today.getDate() - i);
      const untilDate = new Date(today);
      untilDate.setDate(today.getDate() - (i - 1));
      const pad = n => n.toString().padStart(2, '0');
      const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      return {
        sinceUnix: Math.floor(sinceDate.getTime() / 1000),
        untilUnix: Math.floor(untilDate.getTime() / 1000),
        sinceStr: fmt(sinceDate),
        untilStr: fmt(untilDate)
      };
    }

    function getHashParams() {
      const hash = window.location.hash.substr(1);
      const params = {};
      hash.split('&').forEach(pair => {
        const [key, value] = pair.split('=');
        if (key) params[key] = decodeURIComponent(value ?? '');
      });
      return params;
    }

    async function fetchFacebookAccounts(accessToken) {
      const endpoint = `https://graph.facebook.com/v23.0/me/accounts?fields=id,name,access_token,instagram_business_account&access_token=${accessToken}`;
      const response = await fetch(endpoint);
      return response.json();
    }

    async function fetchInstagramInsightsForDay(instagramBusinessId, accessToken, since, until) {
      // Consulta todas las métricas de un día (period=day, metric_type=total_value)
      const metricParams = `metric=${METRICS.join(',')}`;
      const url =
        `https://graph.facebook.com/v20.0/${instagramBusinessId}/insights?` +
        `${metricParams}&period=day&since=${since}&until=${until}&metric_type=total_value&access_token=${accessToken}`;
      const response = await fetch(url);
      return response.json();
    }

    // Construye la tabla como en Google Sheets
    function buildDailyTable(rows, metrics) {
      let html = "<table><thead><tr>";
      html += "<th>From</th><th>Fecha</th>";
      metrics.forEach(m => html += `<th>${m}</th>`);
      html += "</tr></thead><tbody>";
      rows.forEach(row => {
        html += "<tr>";
        row.forEach(cell => html += `<td>${cell !== undefined ? cell : ""}</td>`);
        html += "</tr>";
      });
      html += "</tbody></table>";
      return html;
    }

    async function main() {
      const resultsDiv = document.getElementById('results');
      const params = getHashParams();
      const accessToken = params.access_token;

      if (!accessToken) {
        resultsDiv.innerHTML = `<span class="error">
          No se encontró el token de acceso en la URL.<br>
          Por favor, inicia sesión nuevamente.
        </span>
        <pre>${JSON.stringify(params, null, 2)}</pre>`;
        return;
      }

      resultsDiv.innerHTML = "Consultando páginas y cuentas de Instagram Business...";

      try {
        const data = await fetchFacebookAccounts(accessToken);

        if (data.error) {
          resultsDiv.innerHTML = `<span class="error">Error al consultar la API:</span>
          <pre>${JSON.stringify(data.error, null, 2)}</pre>`;
          return;
        }

        const account = (data.data && data.data.length > 0) ? data.data[0] : null;
        const igBusinessId = account && account.instagram_business_account && account.instagram_business_account.id;

        if (!igBusinessId) {
          resultsDiv.innerHTML = `<span class="error">No se encontró una cuenta de Instagram Business vinculada.</span>`;
          return;
        }

        // Rango de días
        const daysSince = 7; // Cambia a 30 si quieres el mes completo
        const daysUntil = 1; // hasta ayer (para excluir el día de hoy)
        const today = new Date();

        resultsDiv.innerHTML = `Consultando insights diarios de Instagram Business (ID: <b>${igBusinessId}</b>)...<br>Esto puede tardar unos segundos.<br><br>`;

        // Armar las filas
        let allRows = [];

        for (let i = daysSince; i > daysUntil; i--) {
          const { sinceUnix, untilUnix, sinceStr, untilStr } = getSinceUntilForDay(today, i);

          try {
            // Esperar la petición para cada día
            const insights = await fetchInstagramInsightsForDay(igBusinessId, accessToken, sinceUnix, untilUnix);

            if (insights.error) {
              allRows.push([sinceStr, untilStr].concat(METRICS.map(() => "Error")));
              continue;
            }

            // Armar la fila: fechas y cada métrica buscada
            const row = [sinceStr, untilStr];
            METRICS.forEach(metricName => {
              const metricData = insights.data?.find(item => item.name === metricName);
              if (metricData && metricData.total_value && metricData.total_value.value !== undefined) {
                row.push(metricData.total_value.value);
              } else {
                row.push(""); // Si no hay datos, deja la celda vacía
              }
            });
            allRows.push(row);

          } catch (e) {
            allRows.push([sinceStr, untilStr].concat(METRICS.map(() => "Error")));
          }
        }

        resultsDiv.innerHTML += buildDailyTable(allRows, METRICS);

      } catch (err) {
        resultsDiv.innerHTML = `<span class="error">Error de red o inesperado:</span>
        <pre>${err.message}</pre>`;
      }
    }

    main();
  </script>
</body>
</html>
