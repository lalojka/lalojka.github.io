<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome!</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1 id="welcome"></h1>
  </div>
  <script>
    // Recupera el nombre desde sessionStorage
    const name = sessionStorage.getItem("fb_name") || "user";
    document.getElementById("welcome").textContent = `Hello, ${name}!`;
  </script>
</body>
</html>
