<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Instagram Business Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2em; }
    #results { margin-top: 2em; }
    pre { background: #f4f4f4; padding: 1em; border-radius: 5px; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>Instagram Business Dashboard</h1>
  <div id="results">Procesando autenticación...</div>
  <script>
    // Extrae parámetros del hash de la URL
    function getHashParams() {
      const hash = window.location.hash.substr(1);
      const params = {};
      hash.split('&').forEach(pair => {
        const [key, value] = pair.split('=');
        if (key) params[key] = decodeURIComponent(value ?? '');
      });
      return params;
    }

    async function fetchFacebookAccounts(accessToken) {
      const endpoint = `https://graph.facebook.com/v23.0/me/accounts?fields=id,name&access_token=${accessToken}`;
      const response = await fetch(endpoint);
      return response.json();
    }

    async function main() {
      const resultsDiv = document.getElementById('results');
      const params = getHashParams();
      const accessToken = params.access_token;

      if (!accessToken) {
        resultsDiv.innerHTML = `<span class="error">
          No se encontró el token de acceso en la URL.<br>
          Por favor, inicia sesión nuevamente.
        </span>
        <pre>${JSON.stringify(params, null, 2)}</pre>`;
        return;
      }

      resultsDiv.innerHTML = "Consultando páginas y cuentas de Instagram Business...";

      try {
        const data = await fetchFacebookAccounts(accessToken);

        if (data.error) {
          resultsDiv.innerHTML = `<span class="error">Error al consultar la API:</span>
          <pre>${JSON.stringify(data.error, null, 2)}</pre>`;
        } else {
          resultsDiv.innerHTML = `<b>Respuesta de la API:</b>
          <pre>${JSON.stringify(data, null, 2)}</pre>`;
        }
      } catch (err) {
        resultsDiv.innerHTML = `<span class="error">Error de red o inesperado:</span>
        <pre>${err.message}</pre>`;
      }
    }

    main();
  </script>
</body>
</html>
