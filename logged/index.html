<!DOCTYPE html> <html> <head> <title>Login Success - EPM Marketing</title> </head> <body> <h1>Procesando login...</h1> <div id="result"></div> <script> // Capturar tokens del URL fragment function parseFragment() { const hash = window.location.hash.substring(1); const params = new URLSearchParams(hash); const result = { access_token: params.get('access_token'), long_lived_token: params.get('long_lived_token'), expires_in: params.get('expires_in'), error: params.get('error'), error_description: params.get('error_description') }; return result; } // Mostrar resultado function displayResult() { const tokens = parseFragment(); const resultDiv = document.getElementById('result'); if (tokens.error) { resultDiv.innerHTML = ` <div style="color: red; padding: 20px; border: 1px solid red;"> <h3>Error:</h3> <p><strong>${tokens.error}</strong></p> <p>${tokens.error_description}</p> </div> `; } else if (tokens.access_token) { resultDiv.innerHTML = ` <div style="color: green; padding: 20px; border: 1px solid green;"> <h3>¡Login exitoso!</h3> <p><strong>Access Token:</strong> ${tokens.access_token.substring(0, 20)}...</p> <p><strong>Long-lived Token:</strong> ${tokens.long_lived_token ? tokens.long_lived_token.substring(0, 20) + '...' : 'N/A'}</p> <p><strong>Expires in:</strong> ${tokens.expires_in} seconds</p> <button onclick="getPages()">Obtener Facebook Pages</button> </div> `; // Guardar tokens para uso posterior localStorage.setItem('fb_access_token', tokens.access_token); if (tokens.long_lived_token) { localStorage.setItem('fb_long_lived_token', tokens.long_lived_token); } } else { resultDiv.innerHTML = ` <div style="color: orange; padding: 20px; border: 1px solid orange;"> <p>No se encontraron tokens en la URL.</p> <p>URL actual: ${window.location.href}</p> </div> `; } } // Obtener Facebook Pages async function getPages() { const token = localStorage.getItem('fb_access_token'); if (!token) { alert('No hay token disponible'); return; } try { const response = await fetch(`https://graph.facebook.com/v23.0/me/accounts?fields=id,name,access_token,instagram_business_account&access_token=${token}`); const data = await response.json(); console.log('Pages response:', data); if (data.error) { document.getElementById('result').innerHTML += ` <div style="color: red; margin-top: 20px; padding: 15px; border: 1px solid red;"> <h4>Error obteniendo pages:</h4> <p>${data.error.message}</p> </div> `; } else { document.getElementById('result').innerHTML += ` <div style="margin-top: 20px; padding: 15px; border: 1px solid blue;"> <h4>Facebook Pages encontradas:</h4> <pre>${JSON.stringify(data, null, 2)}</pre> </div> `; } } catch (error) { console.error('Error:', error); alert('Error getting pages: ' + error.message); } } // Ejecutar al cargar la página displayResult(); </script> </body> </html>
