<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Facebook Pages API Response</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2em; }
    #results { margin-top: 2em; }
    pre { background: #f4f4f4; padding: 1em; border-radius: 5px; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>Respuesta cruda de Facebook Pages API</h1>
  <div id="results">Cargando...</div>
  <script>
    async function fetchPages() {
      const accessToken = sessionStorage.getItem('fb_access_token');
      const resultsDiv = document.getElementById('results');
      if (!accessToken) {
        resultsDiv.innerHTML = '<span class="error">Access token not found. Please log in again.</span>';
        return;
      }

      try {
        const response = await fetch(`https://graph.facebook.com/v20.0/me/accounts?access_token=${accessToken}`);
        const data = await response.json();
        resultsDiv.innerHTML = `<b>Respuesta cruda de la API:</b>
          <pre>${JSON.stringify(data, null, 2)}</pre>`;
        console.log("Respuesta cruda de Facebook API:", data);
      } catch (error) {
        resultsDiv.innerHTML = `<span class="error">Error: ${error.message}</span>`;
        console.error(error);
      }
    }

    fetchPages();
  </script>
</body>
</html>
