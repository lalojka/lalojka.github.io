<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>EPM APP – Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../css/dashboard.css">
  <script type="module">
    import { getAccessToken } from './js/auth.js';
    getAccessToken(); // Esto guarda el token si está en la URL
  </script>
</head>
<body>
  <div class="dashboard-main">
    <section class="dashboard-content">
      <h2>¡Welcome to EPM APP dashboard!</h2>
      <p>Here you can access your business metrics.</p>
      <div class="dashboard-cards">
        <div class="dashboard-card">
          <h3>Organic data</h3>
          <p>Check on you daily general data of your Instagram account.</p>
          <a class="dashboard-btn" href="metrics.html">See data &rarr;</a>
        </div>
        <div class="dashboard-card dashboard-card-disabled">
          <h3>Posts</h3>
          <p>Analyze your posts performance.</p>
          <a class="dashboard-btn" href="posts.html">See data &rarr;</a>
        </div>
        <div class="dashboard-card dashboard-card-disabled">
          <h3>Settings</h3>
          <p>Próximamente: Gestiona tus cuentas y preferencias.</p>
          <span class="dashboard-btn disabled">Próximamente</span>
        </div>
      </div>
    </section>
  </div>
  <!-- Header, Sidebar y Footer se insertan por JS -->
  <script type="module">
    import { insertHeaderFooter, insertSidebar, enableLogout } from './js/layout.js';
    insertHeaderFooter();
    insertSidebar("index");
    enableLogout();
    // Si querés lógica extra del hub, la importás acá
  </script>
</body>
</html>
