<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Selecciona una cuenta de Instagram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Selecciona una cuenta de Instagram para acceder a tus métricas y reportes.">
  <meta property="og:title" content="Selecciona una cuenta de Instagram" />
  <meta property="og:description" content="Selecciona una cuenta de Instagram para acceder a tus métricas y reportes." />
  <meta property="og:image" content="https://app.epm-marketing.com/img/logo.png" />
  <meta property="og:url" content="https://app.epm-marketing.com/logged/select-account.html" />
  <meta property="og:type" content="website" />
  <meta property="fb:app_id" content="493451440039423" />
  <link rel="icon" href="../img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../styles.css">
  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/auth.js"></script>
</head>
<body>
  <main class="dashboard-main">
    <section class="dashboard-content">
      <h1>Selecciona una cuenta de Instagram</h1>
      <div id="instagram-accounts-list" class="ig-accounts-list"></div>
    </section>
  </main>

  <script type="module">
    import { insertHeaderFooter } from './js/layout.js';
    import { getInstagramAccounts, setSelectedInstagramId, fetchAndStoreFacebookAndInstagramProfile, fetchAndStoreInstagramAccounts } from './js/auth.js';

    insertHeaderFooter();
    mostrarCuentasInstagram();
    // Espera que termine de guardar FB+IG antes de mostrar las cuentas
  await fetchAndStoreFacebookAndInstagramProfile();
  

    async function mostrarCuentasInstagram() {
      let cuentas = getInstagramAccounts();
      if (!cuentas.length) {
        // Intentamos refrescar las cuentas desde la API
        cuentas = await fetchAndStoreInstagramAccounts();
      }
      const contenedor = document.getElementById('instagram-accounts-list');
      if (!cuentas.length) {
        contenedor.innerHTML = '<p>No se encontraron cuentas de Instagram asociadas a tu usuario de Facebook. EPM App puede ser utilizada únicamente para cuentas de instagram de creadores o empresariales. Disculpe las molestias.</p>';
      } else {
        contenedor.innerHTML = cuentas.map(acc => `
          <div class="ig-account-card" data-id="${acc.id}" tabindex="0">
            <img src="${acc.profile_picture_url || '../img/ig_default.png'}" alt="${acc.username}" class="ig-account-img">
            <div class="ig-account-info">
              <div class="ig-account-username">@${acc.username}</div>
              <div class="ig-account-name">${acc.name || ''}</div>
            </div>
          </div>
        `).join('');
        // Click handler para seleccionar cuenta
        contenedor.querySelectorAll('.ig-account-card').forEach(card => {
          card.addEventListener('click', () => {
            setSelectedInstagramId(card.getAttribute('data-id'));
            window.location.href = 'dashboard.html';
          });
        });
      }
    }

  </script>
  <script src="js/propagateDevParam.js"></script>
</body>
</html>
