<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>EPM APP – Selecciona Cuenta Instagram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./css/dashboard.css">
</head>
<body>
  <div class="dashboard-main">
    <aside class="dashboard-sidebar"></aside>
    <section class="dashboard-content">
      <h2>Selecciona tu cuenta de Instagram</h2>
      <div id="instagram-accounts-list"></div>
    </section>
  </div>
  <script type="module">
    import { insertHeaderFooter, insertSidebar, insertIgAccountSidebar, enableLogout } from './js/layout.js';
    import { getInstagramAccounts, fetchAndStoreInstagramAccounts, setSelectedInstagramId } from './js/auth.js';

    insertHeaderFooter();
    insertSidebar();
    insertIgAccountSidebar();
    enableLogout();

    async function mostrarCuentasInstagram() {
      let cuentas = getInstagramAccounts();
      if (!cuentas.length) {
        // Intentamos refrescar las cuentas desde la API
        cuentas = await fetchAndStoreInstagramAccounts();
      }
      const contenedor = document.getElementById('instagram-accounts-list');
      if (!cuentas.length) {
        contenedor.innerHTML = '<p>No se encontraron cuentas de Instagram asociadas a tu usuario de Facebook.</p>';
      } else {
        contenedor.innerHTML = cuentas.map(acc => `
          <div class="ig-account-card" data-id="${acc.id}" tabindex="0">
            <img src="${acc.profile_picture_url || './img/ig_default.png'}" alt="${acc.username}" class="ig-account-img">
            <div class="ig-account-info">
              <div class="ig-account-username">@${acc.username}</div>
              <div class="ig-account-name">${acc.name || ''}</div>
            </div>
          </div>
        `).join('');
        // Click handler para seleccionar cuenta
        contenedor.querySelectorAll('.ig-account-card').forEach(card => {
          card.addEventListener('click', () => {
            setSelectedInstagramId(card.getAttribute('data-id'));
            window.location.href = 'dashboard.html';
          });
        });
      }
    }
    mostrarCuentasInstagram();
  </script>
</body>
</html>
