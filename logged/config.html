<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EPM APP – Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Manage your EPM APP settings, privacy, and permissions.">
  <meta property="og:title" content="EPM APP Settings" />
  <meta property="og:description" content="Manage your account settings, privacy, and permissions in EPM APP." />
  <meta property="og:image" content="https://app.epm-marketing.com/img/logo.png" />
  <meta property="og:url" content="https://app.epm-marketing.com/logged/settings.html" />
  <meta property="og:type" content="website" />
  <meta property="fb:app_id" content="493451440039423" />
  <link rel="icon" href="../img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/dashboard.css">

</head>
<body>
  <div class="dashboard-main">
    <section class="dashboard-content">
      <h2>Settings</h2>
      <!-- Minimum required by Facebook: account info, permissions, privacy links, logout -->
      <div class="settings-section">
        <h3>Your Account</h3>
        <div id="user-info">Loading user data...</div>
        <button id="logout-btn" type="button">Log out</button>
        <button id="reauth-btn" type="button">Re-authenticate Facebook</button>
      </div>
      <div class="settings-section">
        <h3>Privacy and Permissions</h3>
        <ul>
          <li><a href="../privacy-policy.html" target="_blank">Privacy Policy</a></li>
          <li><a href="../terms.html" target="_blank">Terms of Service</a></li>
        </ul>
        <div id="permissions-info">Loading granted permissions...</div>
      </div>
    </section>
  </div>
  <!-- Header, Sidebar and Footer are inserted by JS -->
  <script type="module">
    import { insertHeaderFooter, insertSidebar, enableLogout } from './js/layout.js';
    import { main as settingsMain } from './js/settings.js';
    insertHeaderFooter();
    insertSidebar("settings");
    enableLogout();
    settingsMain();
  </script>
</body>
</html>
