<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>EPM APP – Publicaciones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Accede a las métricas y análisis de tus publicaciones de Instagram con EPM APP.">
  <meta property="og:title" content="EPM APP – Publicaciones" />
  <meta property="og:description" content="Analiza el rendimiento de tus publicaciones de Instagram con EPM APP." />
  <meta property="og:image" content="https://app.epm-marketing.com/img/logo.png" />
  <meta property="og:url" content="https://app.epm-marketing.com/logged/posts.html" />
  <meta property="og:type" content="website" />
  <meta property="fb:app_id" content="493451440039423" />
  <link rel="icon" href="../img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/posts.css">

<body>
  <div class="dashboard-main">
    <section class="dashboard-content">
      <h2>Publicaciones</h2>
      <div class="epm-posts">
        <div id="posts-cards" class="epm-posts-cards"></div>
        <div id="posts-empty" class="epm-posts-empty" style="display: none;">No se encontraron publicaciones.</div>
      </div>
    </section>
  </div>
  <!-- Header, Sidebar y Footer se insertan por JS -->
  <script type="module">
    import { insertHeaderFooter, insertSidebar, enableLogout } from './js/layout.js';
    import { main as postsMain } from './js/posts.js';
    insertHeaderFooter();
    insertSidebar("posts");
    enableLogout();
    postsMain();
  </script>
  <script src="js/propagateDevParam.js"></script>
</body>
</html>
